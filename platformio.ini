; WireRx firmware - ESP32-S3-WROOM-1 + 3.5" 480x320 SPI TFT + LVGL v8 + TFT_eSPI + 2x ADS1015
; NOTE: upload/monitor through the UART (CH343) port.
[env:wirerx]
; Pinned: TFT_eSPI 2.5.x crashes in tft.begin() on ESP32-S3 with Arduino core 3.x (platform 7/8).
; 6.9.0 = Arduino-ESP32 core 2.0.17.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit ADS1X15@^2.4.0

build_flags =
    -I include
    ; ---- LVGL ----
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; ---- TFT_eSPI (configured here, no User_Setup.h editing needed) ----
    -DUSER_SETUP_LOADED=1
    ; Colour test confirmed ILI9488 driver on this module (ILI9486 gave wrong colours)
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    ; Final display pins: CS10 RST7 DC14 MOSI11 SCK12; touch (XPT2046) DO=MISO13, T_CS=GPIO1
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=7
    ; S3 fix: HSPI port avoids StoreProhibited crash in tft.begin()
    -DUSE_HSPI_PORT=1
    -DTOUCH_CS=1
    -DSPI_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

; ---------------------------------------------------------------------------
; Display-only test: fills the screen with solid colours (no LVGL / ADC / WiFi).
; Build: pio run -e displaytest
; ---------------------------------------------------------------------------
[env:displaytest]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<../test_display/main.cpp>

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    ; Vendor sketch for this 3.5" module uses ILI9486_DRIVER (not ILI9488/ST7796)
    -DILI9486_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    ; Final display pins: CS10 RST7 DC14 MOSI11 SCK12 (display SDO not connected, touch DO=13)
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=7
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

; ---------------------------------------------------------------------------
; Pin test: toggles the 5 display signal pins one at a time (no display library).
; Build: pio run -e pintest
; ---------------------------------------------------------------------------
[env:pintest]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<../test_pins/main.cpp>

; ---------------------------------------------------------------------------
; Display test v2: ILI9486, final pins, prints a [D2] banner.
; Build: pio run -e displaytest2
; ---------------------------------------------------------------------------
[env:displaytest2]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<../test_display2/main.cpp>

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9486_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=7
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1