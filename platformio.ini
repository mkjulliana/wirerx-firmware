; WireRx firmware - ESP32-S3-WROOM-1 + 3.5" 480x320 SPI TFT + LVGL v8 + TFT_eSPI + 2x ADS1015
; NOTE: GPIO19/20 are used for SPI, so upload/monitor through the UART port (not native USB).
[env:wirerx]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit ADS1X15@^2.4.0

build_flags =
    -I include
    ; ---- LVGL ----
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; ---- TFT_eSPI (configured here, no User_Setup.h editing needed) ----
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=19
    -DTFT_MISO=21
    -DTFT_SCLK=20
    -DTFT_CS=15
    -DTFT_DC=13
    -DTFT_RST=7
    -DTOUCH_CS=39
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
